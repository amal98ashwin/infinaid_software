name: Build Windows EEG Studio
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Prepare private Python runtime
        shell: pwsh
        run: |
          $v = python -c "import platform; print(platform.python_version())"
          $root = New-Item -ItemType Directory -Path payload
          Invoke-WebRequest "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" -OutFile runtime.zip
          Expand-Archive runtime.zip "$root/runtime"
          Copy-Item app.py,functions.py,launch.py,smoke.py,static -Destination $root -Recurse
          @('python311.zip','.','Lib/site-packages','..','import site') | Set-Content "$root/runtime/python311._pth" -Encoding ascii
      - name: Install EEG libraries into the private runtime
        run: python -m pip install --only-binary=:all: --target payload/runtime/Lib/site-packages -r requirements.txt
      - name: Run the EEG pipeline with the bundled Python
        run: .\payload\runtime\python.exe -X utf8 .\payload\launch.py --smoke
      - name: Package standalone Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { choco install innosetup --yes --no-progress }
          & $compiler windows.iss
          exit $LASTEXITCODE
      - name: Install and check the packaged application
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'EEG Studio Check'
          $installer = Start-Process -FilePath 'release\Infinaid-EEG-Studio-Windows-x64.exe' -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$dest`"" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          & "$dest\runtime\python.exe" -X utf8 "$dest\launch.py" --smoke
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: Infinaid-EEG-Studio-Windows-x64
          path: release/Infinaid-EEG-Studio-Windows-x64.exe
          if-no-files-found: error
